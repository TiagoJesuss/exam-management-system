spring.application.name=ems-test

spring.datasource.url=jdbc:h2:mem:emsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Europe/Lisbon

security.jwt.secret-key=TESTSECRETKEYFORRBACSECURITYTESTS1234567890
security.jwt.expiration-ms=86400000

ems.uploads.dir=target/test-uploads
ems.review.deadline-hours=48
ems.review.close-check-ms=300000
ems.seed.demo-exams=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
